<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad Tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper: #fbfaf7; --ink: #141414; --soft: #6b6862; --line: #d9d5cc; --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #efece5; color: var(--ink); font: 13px/1.4 var(--mono); }
.app { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
aside { background: var(--paper); border-right: 2px solid var(--ink); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
.sub { margin: 0; color: var(--soft); font-size: 12px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
button { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; background: var(--paper); color: var(--ink);
  border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 9px 10px; cursor: pointer; }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.vals { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: 12px; }
.vals dt { color: var(--soft); }
.vals dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.vals .hot { color: var(--ink); font-weight: 600; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.box { position: absolute; border: 1.5px dashed rgba(20, 20, 20, 0.55); }
.e { position: absolute; height: 12px; transform-origin: 0 50%; pointer-events: auto; touch-action: none; }
.e::after { content: ''; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: #e8542f; opacity: 0; }
.e:hover::after, .e.drag::after { opacity: 1; }
.e.ew { cursor: ew-resize; } .e.ns { cursor: ns-resize; } .e.nesw { cursor: nesw-resize; } .e.nwse { cursor: nwse-resize; }
.e.ghost::after { opacity: 1; background: none; border-top: 2px dashed #e8542f; height: 0; }
.ibox.ring { border-radius: 50%; border-style: dashed; }
.ibox { position: absolute; border: 1px dotted rgba(20, 20, 20, 0.45); }
.tip { position: absolute; transform: translate(12px, -130%); background: var(--ink); color: var(--paper); font-size: 11px; padding: 3px 6px; white-space: nowrap; pointer-events: none; }
.foot { display: grid; gap: 8px; margin-top: auto; }
.row { display: flex; gap: 8px; }
.row button { flex: 1; }
#submit { background: var(--ink); color: var(--paper); padding: 12px; font-size: 12px; }
#status { min-height: 1.4em; font-size: 12px; color: var(--soft); }
main { overflow: auto; padding: 22px; }
.zoom { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--soft); font-size: 12px; }
.zoom input { width: 160px; accent-color: var(--ink); }
.frames { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
figure { margin: 0; display: grid; gap: 6px; cursor: pointer; }
figcaption { font-size: 12px; color: var(--soft); }
figure.on figcaption { color: var(--ink); font-weight: 600; }
.phone { position: relative; overflow: hidden; border: 2px solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 4px 4px 0 var(--ink); }
figure.on .phone { outline: 3px solid var(--ink); outline-offset: 4px; }
.phone iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div>
      <h1>Touch pad sizes</h1>
      <p class="sub">The real game, as a phone sees it. Grab an edge of the controls and drag it to stretch or shrink that part (hovering an edge lights it and says what it sets); click the buttons themselves to try them. Each way of holding the phone has its own sizes: pick one above to see it.</p>
    </div>
    <div class="tabs" id="tabs"></div>
    <dl class="vals" id="vals"></dl>
    <div class="foot">
      <div class="row"><button type="button" id="reset">Reset this one</button><button type="button" id="resetAll">Reset all</button></div>
      <button type="button" id="submit">Submit to Claude</button>
      <div id="status" role="status"></div>
    </div>
  </aside>
  <main>
    <div class="zoom"><span>Zoom</span><input type="range" id="zoom" min="0.35" max="1.5" step="0.01" value="0.9"><output id="zoomOut"></output></div>
    <div class="frames" id="frames"></div>
  </main>
</div>
<script>
// the four ways of holding the phone, as the game names them (PAD_SIZES), and the phone each is shown on
const LAYOUTS = [
  { key: 'upright', name: 'Upright', w: 390, h: 844, split: false },
  { key: 'split', name: 'Shared, upright', w: 390, h: 844, split: true },
  { key: 'side', name: 'On its side', w: 844, h: 390, split: false },
  { key: 'splitSide', name: 'Shared, on its side', w: 844, h: 390, split: true },
];
// [setting, label, min, max, unit]
const KNOBS = [
  ['padW', 'Joypad width', 60, 300, 'px'], ['padH', 'Joypad height', 50, 300, 'px'],
  ['arrow', 'Top triangles (move)', 6, 90, 'px'], ['corner', 'Bottom triangles (crouch-walk)', 6, 90, 'px'],
  ['grow', 'Growth near the thumb', 0, 200, '%'], ['inset', 'Triangles in from the edge', 0, 40, 'px'],
  ['dead', 'Dead middle', 0, 70, '%'],
  ['act', 'Action button size', 28, 90, 'px'], ['actGap', 'Gap between actions', 0, 24, 'px'],
  ['icon', 'Icon size', 10, 72, 'px'], ['edgeX', 'Distance from the side', 0, 90, 'px'], ['edgeY', 'Distance from the bottom', 0, 90, 'px'],
];
const KNOB = Object.fromEntries(KNOBS.map(k => [k[0], k]));
const $ = id => document.getElementById(id);
let current = 'upright', defaults = null, sizes = null, hot = null, setup = null;
const frames = [];

// which frame's values the list shows (the last one touched, or picked from the tabs)
$('tabs').innerHTML = LAYOUTS.map(l => `<button type="button" data-key="${l.key}">${l.name}</button>`).join('');
// one phone at a time (each copy of the game takes several WebGL contexts, and a page gets only so many): picking a
// way of holding it loads the game afresh in that shape
function select(key) {
  current = key;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key));
  const f = frames[0];
  if (f && f.l.key !== key) load(f, LAYOUTS.find(l => l.key === key));
  showVals();
}
function showVals() {
  if (!sizes) return;
  $('vals').innerHTML = KNOBS.map(([k, label, , , unit]) => `<dt class="${k === hot ? 'hot' : ''}">${label}</dt><dd class="${k === hot ? 'hot' : ''}">${Math.round(sizes[current][k])}${unit}</dd>`).join('');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.key); });
// every frame has every layout's sizes (each shows the one for how it's held)
const push = (key, z) => frames.forEach(f => f.ready && f.win().__bbPadSizes(key, z));
function set(key, k, v) {
  const [, , lo, hi] = KNOB[k];
  sizes[key][k] = Math.round(Math.min(hi, Math.max(lo, v)));
  push(key, { [k]: sizes[key][k] });
}
$('reset').addEventListener('click', () => { sizes[current] = { ...defaults[current] }; push(current, sizes[current]); showVals(); });
$('resetAll').addEventListener('click', () => { for (const l of LAYOUTS) { sizes[l.key] = { ...defaults[l.key] }; push(l.key, sizes[l.key]); } showVals(); });
$('submit').addEventListener('click', async () => {
  if (!sizes) return;
  $('status').textContent = 'Sending…';
  try {
    const r = await fetch('/submit', { method: 'POST', body: JSON.stringify(sizes) });
    if (!r.ok) throw new Error(await r.text());
    $('status').textContent = `Submitted at ${new Date().toLocaleTimeString()}. Claude reads it from tools/padtune/submitted.json.`;
  } catch (err) { $('status').textContent = 'Not sent: ' + err.message; }
});

// ---------- edges: grab one and drag it to stretch or shrink that part ----------
// seg: the edge in the phone (CSS px, from the controls' boxes); dir: which way it drags; set: the new value from
// the drag (dx, dy in phone px since it began, z0 the sizes then). The pad is pinned at the bottom left and the
// actions at the bottom right, so the edges away from the pins stretch them, and those on the pins move them in
// from the screen's edges. Each value tracks the edge under the pointer.
const EDGES = [
  { tip: 'Joypad height', dir: 'ns', seg: b => [b.pad.left, b.pad.top, b.pad.right, b.pad.top], set: (key, z, dx, dy) => set(key, 'padH', z.padH - dy) },
  { tip: 'Joypad width', dir: 'ew', seg: b => [b.pad.right, b.pad.top, b.pad.right, b.pad.bottom], set: (key, z, dx) => set(key, 'padW', z.padW + dx) },
  { tip: 'Distance from the side', dir: 'ew', seg: b => [b.pad.left, b.pad.top, b.pad.left, b.pad.bottom], set: (key, z, dx) => set(key, 'edgeX', z.edgeX + dx) },
  { tip: 'Distance from the bottom', dir: 'ns', seg: b => [b.pad.left, b.pad.bottom, b.pad.right, b.pad.bottom], set: (key, z, dx, dy) => set(key, 'edgeY', z.edgeY - dy) },
  { tip: 'Dead middle', dir: 'ew', seg: b => [b.dead.right, b.dead.top, b.dead.right, b.dead.bottom], set: (key, z, dx) => set(key, 'dead', z.dead + 2 * dx / Math.min(z.padW, z.padH) * 100) },
  { tip: 'Top triangles (move)', dir: 'nwse', seg: b => [b.tUL.right, b.tUL.top, b.tUL.left, b.tUL.bottom], set: (key, z, dx, dy) => set(key, 'arrow', z.arrow + dx + dy) },
  { tip: 'Growth near the thumb', dir: 'nwse', ghost: true, seg: b => { const g = b.z.arrow * (1 + b.z.grow / 100) * b.k; return [b.tUL.left + g, b.tUL.top, b.tUL.left, b.tUL.top + g]; },
    set: (key, z, dx, dy) => set(key, 'grow', z.grow + (dx + dy) / z.arrow * 100) },
  { tip: 'Bottom triangles (crouch-walk)', dir: 'nesw', seg: b => [b.tDL.left, b.tDL.top, b.tDL.right, b.tDL.bottom], set: (key, z, dx, dy) => set(key, 'corner', z.corner + dx - dy) },
  { tip: 'Triangles in from the edge', dir: 'ns', seg: b => [b.tUR.left, b.tUR.top, b.tUR.right, b.tUR.top], set: (key, z, dx, dy) => set(key, 'inset', z.inset + dy) },
  { tip: 'Action button size', dir: 'ns', seg: b => [b.acts.left, b.acts.top, b.acts.right, b.acts.top], set: (key, z, dx, dy) => set(key, 'act', z.act - dy / 2) },
  { tip: 'Action button size', dir: 'ew', seg: b => [b.acts.left, b.acts.top, b.acts.left, b.acts.bottom], set: (key, z, dx) => set(key, 'act', z.act - dx / 4) },
  { tip: 'Distance from the side', dir: 'ew', seg: b => [b.acts.right, b.acts.top, b.acts.right, b.acts.bottom], set: (key, z, dx) => set(key, 'edgeX', z.edgeX - dx) },
  { tip: 'Distance from the bottom', dir: 'ns', seg: b => [b.acts.left, b.acts.bottom, b.acts.right, b.acts.bottom], set: (key, z, dx, dy) => set(key, 'edgeY', z.edgeY - dy) },
  { tip: 'Gap between actions', dir: 'ew', seg: b => { const x = (b.act.right + b.act2.left) / 2; return [x, b.acts.top, x, b.acts.bottom]; }, set: (key, z, dx) => set(key, 'actGap', z.actGap - dx / 2.5) },
  { tip: 'Gap between actions', dir: 'ns', seg: b => { const y = (b.act.bottom + b.shield.top) / 2; return [b.acts.left, y, b.acts.right, y]; }, set: (key, z, dx, dy) => set(key, 'actGap', z.actGap - 2 * dy) },
  { tip: 'Icon size', dir: 'ew', seg: b => [b.icon.right, b.icon.top, b.icon.right, b.icon.bottom], set: (key, z, dx) => set(key, 'icon', z.icon + 2 * dx), box: 'icon' },
  { tip: 'Icon size', dir: 'ns', seg: b => [b.icon.left, b.icon.bottom, b.icon.right, b.icon.bottom], set: (key, z, dx, dy) => set(key, 'icon', z.icon + 2 * dy) },
];
const VALUE_OF = { 'Joypad height': 'padH', 'Joypad width': 'padW', 'Distance from the side': 'edgeX', 'Distance from the bottom': 'edgeY', 'Dead middle': 'dead', 'Top triangles (move)': 'arrow',
  'Growth near the thumb': 'grow', 'Bottom triangles (crouch-walk)': 'corner', 'Triangles in from the edge': 'inset', 'Action button size': 'act', 'Gap between actions': 'actGap', 'Icon size': 'icon' };
// the controls' boxes in one frame, in phone px (User A's pad: in a shared frame User B's mirrors it)
function boxes(f) {
  const d = f.win().document, r = sel => d.querySelector(sel)?.getBoundingClientRect();
  const b = { z: sizes[f.l.key], pad: r('#touch .pad'), acts: r('#touch .acts'),
    tUL: r('#touch .pad .face.ul'), tUR: r('#touch .pad .face.ur'), tDL: r('#touch .pad .face.dl'), k: 1, act: r('#touch .acts button[data-slot="a1"]'), act2: r('#touch .acts button[data-slot="a2"]'),
    shield: r('#touch .acts .shield'), icon: r('#touch .acts .shield .ico') };
  if (!Object.values(b).every(Boolean)) return null;
  const dd = Math.min(b.pad.width, b.pad.height) * b.z.dead / 100, cx = b.pad.left + b.pad.width / 2, cy = b.pad.top + b.pad.height / 2;
  b.dead = { left: cx - dd / 2, top: cy - dd / 2, right: cx + dd / 2, bottom: cy + dd / 2, width: dd, height: dd };
  return b;
}
function addOverlay(f) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  const padBox = document.createElement('div'), actsBox = document.createElement('div'), deadBox = document.createElement('div'), iconBox = document.createElement('div');
  padBox.className = actsBox.className = 'box'; deadBox.className = 'ibox ring'; iconBox.className = 'ibox';
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true;
  ov.append(padBox, actsBox, deadBox, iconBox);
  let tipAt = null;
  const es = EDGES.map(h => {
    const el = document.createElement('div'), k = VALUE_OF[h.tip];
    el.className = 'e ' + h.dir + (h.ghost ? ' ghost' : '');
    const say = () => { tip.hidden = false; tip.textContent = `${h.tip}: ${sizes[f.l.key][k]}${KNOB[k][4]}`; };
    el.addEventListener('pointerenter', e => { if (!sizes) return; tipAt = [e.clientX, e.clientY]; say(); });
    el.addEventListener('pointerleave', () => { if (!el.classList.contains('drag')) tip.hidden = true; });
    el.addEventListener('pointerdown', e => {
      if (!f.ready || !sizes) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('drag');
      const x0 = e.clientX, y0 = e.clientY, z0 = { ...sizes[f.l.key] };
      select(f.l.key); hot = k; showVals();
      const move = ev => { h.set(f.l.key, z0, (ev.clientX - x0) / zoom(), (ev.clientY - y0) / zoom()); tipAt = [ev.clientX, ev.clientY]; say(); showVals(); };
      const up = () => { el.classList.remove('drag'); tip.hidden = true; hot = null; showVals(); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    ov.append(el);
    return { h, el };
  });
  ov.append(tip);
  f.box.append(ov);
  // follow the controls every frame (they move as sizes change)
  const box = (el, r) => Object.assign(el.style, { left: r.left * zoom() + 'px', top: r.top * zoom() + 'px', width: r.width * zoom() + 'px', height: r.height * zoom() + 'px' });
  const frame = () => {
    const b = f.ready && sizes && boxes(f);
    ov.hidden = !b;
    if (b) {
      box(padBox, b.pad); box(actsBox, b.acts); box(deadBox, b.dead); box(iconBox, b.icon);
      for (const { h, el } of es) {
        const [x1, y1, x2, y2] = h.seg(b).map(v => v * zoom()), len = Math.max(6, Math.hypot(x2 - x1, y2 - y1));
        Object.assign(el.style, { left: x1 + 'px', top: y1 - 6 + 'px', width: len + 'px', transform: `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)` });
      }
      if (tipAt) { const o = f.box.getBoundingClientRect(); tip.style.left = tipAt[0] - o.left + 'px'; tip.style.top = tipAt[1] - o.top + 'px'; }
    }
    requestAnimationFrame(frame);
  };
  frame();
}

// ---------- the frames: the built game, with its dev hooks (?dev), each started into a match ----------
const zoom = () => +$('zoom').value;
function layoutFrames() {
  $('zoomOut').textContent = Math.round(zoom() * 100) + '%';
  for (const f of frames) {
    f.box.style.width = f.l.w * zoom() + 'px'; f.box.style.height = f.l.h * zoom() + 'px';
    f.ifr.style.transform = `scale(${zoom()})`;
  }
}
$('zoom').addEventListener('input', layoutFrames);
const until = async (test, ms = 30000) => { const t0 = performance.now(); while (!test()) { if (performance.now() - t0 > ms) throw new Error('timed out'); await new Promise(r => setTimeout(r, 100)); } };
async function start(f) {
  const win = f.win(), doc = win.document, run = f.run;
  await until(() => doc.querySelector('.mode[data-mode="training"]') && win.__bbPadSizes);
  await new Promise(r => setTimeout(r, 300));
  if (f.l.split) {
    // two players on one phone: a duel through Play, User A and User B each on their own pad
    doc.querySelector('.mode[data-mode="play"]').click();
    await until(() => doc.getElementById('fightBtn')); doc.getElementById('fightBtn').click();
    await until(() => win.__bb && win.__bb().length === 2);
    win.dispatchEvent(new KeyboardEvent('keydown', { code: 'Enter', key: 'Enter' }));
  } else {
    doc.querySelector('.mode[data-mode="training"]').click();
    await until(() => doc.getElementById('pickBtn')); doc.getElementById('pickBtn').click();
  }
  await until(() => win.__bb && win.__bb().length > 1);
  await (setup ||= (async () => {      // once, by whichever frame is first: the game's sizes, then your last submission
    defaults = JSON.parse(JSON.stringify(win.__bbPadSizes()));
    const last = await fetch('/submitted.json').then(r => r.json()).catch(() => null);
    sizes = JSON.parse(JSON.stringify(defaults));
    if (last) { for (const l of LAYOUTS) Object.assign(sizes[l.key], last[l.key]); $('status').textContent = 'Loaded your last submission.'; }
    showVals();
  })());
  for (const l of LAYOUTS) win.__bbPadSizes(l.key, sizes[l.key]);
  if (run === f.run) f.ready = true;
}
// Play seats User A and User B (the split frames); the frames share this page's storage
try { localStorage.setItem('botbattle.seats', JSON.stringify([{ kind: 'so', ctrl: 'A' }, { kind: 'claude', ctrl: 'B' }])); } catch {}
function load(f, l) {
  f.l = l; f.ready = false; f.run = (f.run || 0) + 1;
  f.ifr.width = l.w; f.ifr.height = l.h; f.ifr.title = `Bot Battle, ${l.name}`;
  f.cap.textContent = `${l.name} · ${l.w} × ${l.h}`;
  f.ifr.src = '/games/botbattle/?dev=padtune&run=' + f.run;
  layoutFrames();
}
{
  const fig = document.createElement('figure'), box = document.createElement('div'), ifr = document.createElement('iframe'), cap = document.createElement('figcaption');
  box.className = 'phone'; fig.className = 'on';
  box.append(ifr); fig.append(cap, box);
  const f = { l: null, fig, box, ifr, cap, ready: false, win: () => ifr.contentWindow };
  ifr.addEventListener('load', () => { const run = f.run, l = f.l; start(f).catch(err => { if (run === f.run) cap.textContent = `${l.name}: didn't start (${err.message})`; }); });
  frames.push(f);
  $('frames').append(fig);
  addOverlay(f);
  load(f, LAYOUTS[0]);
}
select('upright');
</script>
</body>
</html>
